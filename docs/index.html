<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báo Cáo Sản Lượng Đông Mát</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-color);
  min-height: 100vh;
  display: flex;
  overflow: hidden;
}

:root {
  --bg-primary: #070714;
  --sidebar-bg: #0d0d21;
  --sidebar-border: rgba(255, 255, 255, 0.06);
  --sidebar-hover: rgba(79, 172, 254, 0.08);
  --text-color: #e2e8f0;
  --text-muted: #6b7094;
  --text-active: #00f2fe;
  --chevron-color: #6b7094;
  --bg-row2: rgba(255, 255, 255, 0.02);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  
  --sidebar-width: 260px;
}

body.light-mode {
  --bg-primary: #f8fafc;
  --sidebar-bg: #ffffff;
  --sidebar-border: rgba(15, 23, 42, 0.08);
  --sidebar-hover: rgba(59, 130, 246, 0.06);
  --text-color: #0f172a;
  --text-muted: #64748b;
  --text-active: #2563eb;
  --chevron-color: #94a3b8;
  --bg-row2: rgba(15, 23, 42, 0.02);
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
}

.app-container {
  display: flex;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

/* Sidebar Styling */
.sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  flex-shrink: 0;
  z-index: 100;
  box-shadow: var(--shadow);
}

.sidebar.collapsed {
  --sidebar-width: 0px;
  border-right: none;
}

.sidebar-header {
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  border-bottom: 1px solid var(--sidebar-border);
  position: relative;
  overflow: hidden;
}

.logo-box {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  color: white;
  flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(79, 172, 254, 0.3);
}

.logo-text {
  font-size: 1.05rem;
  font-weight: 800;
  margin-left: 12px;
  white-space: nowrap;
  background: linear-gradient(135deg, #00f2fe 0%, #a18cd1 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  transition: opacity 0.2s ease;
}
body.light-mode .logo-text {
  background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.toggle-sidebar-btn {
  position: absolute;
  right: 16px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 1.2rem;
  cursor: pointer;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  transition: all 0.2s;
}
.toggle-sidebar-btn:hover {
  background: var(--sidebar-hover);
  color: var(--text-color);
}

.sidebar.collapsed .logo-text {
  opacity: 0;
  pointer-events: none;
}

.sidebar.collapsed .toggle-sidebar-btn {
  position: relative;
  right: auto;
  margin-left: auto;
}

.sidebar.collapsed .sidebar-header {
  justify-content: center;
  padding: 0;
}

.sidebar.collapsed .logo-box {
  display: none;
}

.sidebar.collapsed .toggle-sidebar-btn {
  margin: 0;
}

/* Sidebar Navigation */
.sidebar-nav {
  flex: 1;
  padding: 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
  overflow-x: hidden;
}

.nav-item {
  height: 46px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  position: relative;
  font-size: 0.88rem;
  font-weight: 600;
  user-select: none;
}

.nav-item:hover {
  background: var(--sidebar-hover);
  color: var(--text-color);
}

.nav-item.active {
  background: var(--sidebar-hover);
  color: var(--text-color);
}

.nav-icon {
  width: 24px;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.nav-text {
  margin-left: 12px;
  transition: opacity 0.2s;
}

.sidebar.collapsed .nav-text {
  opacity: 0;
  pointer-events: none;
  width: 0;
  margin: 0;
}

.chevron-icon {
  margin-left: auto;
  font-size: 0.65rem;
  color: var(--chevron-color);
  transition: transform 0.2s ease;
}

.sidebar.collapsed .chevron-icon {
  display: none;
}

/* Sub Navigation Group */
.nav-group {
  display: flex;
  flex-direction: column;
  border-radius: 10px;
  transition: background 0.3s;
}

.nav-group.active {
  background: rgba(255, 255, 255, 0.015);
}
body.light-mode .nav-group.active {
  background: rgba(0, 0, 0, 0.01);
}

.nav-group .sub-nav-items {
  max-height: 500px;
  overflow: hidden;
  transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  padding-left: 28px;
  gap: 2px;
  margin-top: 2px;
  margin-bottom: 6px;
}

.sidebar.collapsed .nav-group .sub-nav-items {
  display: none !important;
}

.nav-group.collapsed .sub-nav-items {
  max-height: 0;
  margin: 0;
  padding: 0;
  pointer-events: none;
}

.nav-group.collapsed .chevron-icon {
  transform: rotate(-90deg);
}

.sub-nav-item {
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  color: var(--text-muted);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.sub-nav-item:hover {
  background: var(--sidebar-hover);
  color: var(--text-color);
}

.sub-nav-item.active {
  color: var(--text-active);
  font-weight: 700;
  background: var(--sidebar-hover);
}

/* Sidebar Footer */
.sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.theme-toggle-btn-sidebar {
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--sidebar-border);
  background: transparent;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  padding: 0 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  width: 100%;
}
.theme-toggle-btn-sidebar:hover {
  background: var(--sidebar-hover);
  color: var(--text-color);
}

.sidebar.collapsed .theme-toggle-btn-sidebar {
  justify-content: center;
  padding: 0;
  width: 36px;
  margin: 0 auto;
}

.sidebar.collapsed .theme-toggle-btn-sidebar .nav-text {
  display: none;
}

.footer-note {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-align: center;
  white-space: nowrap;
}
.sidebar.collapsed .footer-note {
  display: none;
}

/* Main Content Area */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  height: 100%;
  background: var(--bg-primary);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.02) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.02) 0%, transparent 60%);
  transition: padding 0.3s;
}

.content-header {
  height: 64px;
  border-bottom: 1px solid var(--sidebar-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
}

.content-header h2 {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text-color);
}

.version-tag {
  font-size: 0.7rem;
  background: var(--sidebar-hover);
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 700;
  color: var(--text-muted);
}

.hamburger-btn {
  background: none;
  border: none;
  color: var(--text-color);
  font-size: 1.25rem;
  cursor: pointer;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  margin-right: 8px;
}
.hamburger-btn:hover {
  background: var(--sidebar-hover);
}

.frame-wrap {
  flex: 1;
  padding: 12px;
  display: none;
  min-height: 0;
}

.frame-wrap.active {
  display: flex;
}

.frame-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 12px;
  background: #0b0d12;
  box-shadow: var(--shadow);
}
body.light-mode .frame-wrap iframe {
  background: #ffffff;
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Left Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-box">❄️</div>
      <span class="logo-text">KFM Logistics</span>
      <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="Ẩn/Hiện Menu">☰</button>
    </div>
    
    <nav class="sidebar-nav">
      <!-- Group 1: Nhập/Xuất -->
      <div class="nav-group active" id="groupForecast">
        <div class="nav-item group-title" onclick="toggleGroup()">
          <span class="nav-icon">📦</span>
          <span class="nav-text">Nhập / Xuất Đông Mát</span>
          <span class="chevron-icon">▼</span>
        </div>
        <div class="sub-nav-items">
          <div class="sub-nav-item active" onclick="switchSubTabParent('xuat', this)">📊 Xuất Hàng</div>
          <div class="sub-nav-item" onclick="switchSubTabParent('nhap', this)">📊 Nhập Hàng</div>
          <div class="sub-nav-item" onclick="switchSubTabParent('chitiet', this)">⚠️ Chi Tiết Rớt Hàng</div>
          <div class="sub-nav-item" onclick="switchSubTabParent('dapung', this)">📈 Tỷ Lệ Đáp Ứng</div>
          <div class="sub-nav-item" onclick="switchSubTabParent('forecast', this)">🔮 Capacity Forecast</div>
        </div>
      </div>
      
      <!-- Group 2: Claim ABA -->
      <div class="nav-item" id="menuClaim" onclick="switchMainTabParent(1)">
        <span class="nav-icon">📋</span>
        <span class="nav-text">Claim ABA</span>
      </div>
      
      <!-- Group 3: Đối Soát -->
      <div class="nav-item" id="menuDoiSoat" onclick="switchMainTabParent(2)">
        <span class="nav-icon">🔍</span>
        <span class="nav-text">Đối Soát Xuất Hàng</span>
      </div>
    </nav>
    
    <div class="sidebar-footer">
      <button class="theme-toggle-btn-sidebar" onclick="toggleTheme()" title="Chuyển chế độ sáng/tối">
        <!-- Sun icon -->
        <svg id="sunIcon" style="display: none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <!-- Moon icon -->
        <svg id="moonIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <span class="nav-text" style="margin-left: 8px;">Giao diện</span>
      </button>
      <div class="footer-note">Cập nhật: <span id="ud"></span></div>
    </div>
  </aside>
  
  <!-- Main Display Window -->
  <main class="main-content">
    <div class="content-header">
      <div style="display: flex; align-items: center;">
        <button class="hamburger-btn" onclick="toggleSidebar()" title="Ẩn/Hiện Menu">☰</button>
        <h2 id="pageTitle" style="margin-left: 10px;">📦 Báo Cáo Sản Lượng Đông Mát — Xuất Hàng</h2>
      </div>
      <div class="header-right">
        <span class="version-tag">v2.1.0</span>
      </div>
    </div>
    
    <div class="frame-wrap active" id="f0">
      <iframe id="f0_iframe" src="about:blank"></iframe>
    </div>
    <div class="frame-wrap" id="f1">
      <iframe id="f1_iframe" src="about:blank" loading="lazy"></iframe>
    </div>
    <div class="frame-wrap" id="f2">
      <iframe id="f2_iframe" src="about:blank" loading="lazy"></iframe>
    </div>
  </main>
</div>

<script>
const n=new Date(),p=x=>String(x).padStart(2,'0');
document.getElementById('ud').textContent=p(n.getDate())+'/'+p(n.getMonth()+1)+'/'+n.getFullYear()+' '+p(n.getHours())+':'+p(n.getMinutes());
document.getElementById('f0_iframe').src = 'external/nhap_xuat_dm.html?v=' + Date.now();

// 1. Sidebar Collapse Handling
let isSidebarCollapsed = localStorage.getItem("sidebar_collapsed") === "true";
const sidebarEl = document.getElementById("sidebar");
if (isSidebarCollapsed) {
  sidebarEl.classList.add("collapsed");
}

function toggleSidebar() {
  isSidebarCollapsed = !isSidebarCollapsed;
  sidebarEl.classList.toggle("collapsed", isSidebarCollapsed);
  localStorage.setItem("sidebar_collapsed", isSidebarCollapsed);
}

function toggleGroup() {
  if (isSidebarCollapsed) {
    toggleSidebar();
  }
  const group = document.getElementById("groupForecast");
  group.classList.toggle("collapsed");
}

// 2. Theme State Handling
let isLight = localStorage.getItem("light_mode") === "true";
if (isLight) {
  document.body.classList.add("light-mode");
  document.getElementById("sunIcon").style.display = "block";
  document.getElementById("moonIcon").style.display = "none";
}

function toggleTheme() {
  isLight = !isLight;
  document.body.classList.toggle("light-mode", isLight);
  localStorage.setItem("light_mode", isLight);
  
  document.getElementById("sunIcon").style.display = isLight ? "block" : "none";
  document.getElementById("moonIcon").style.display = isLight ? "none" : "block";
  
  applyThemeToIframes(isLight);
}

function applyThemeToIframes(isLightVal) {
  const iframes = ['f0_iframe', 'f1_iframe', 'f2_iframe'];
  iframes.forEach(id => {
    const iframe = document.getElementById(id);
    if (!iframe || iframe.src === 'about:blank' || iframe.src === '') return;
    
    // 1. Direct toggle for same-origin
    try {
      if (iframe.contentDocument && iframe.contentDocument.body) {
        iframe.contentDocument.body.classList.toggle('light-mode', isLightVal);
        const win = iframe.contentWindow;
        if (win && win.STATE && win.drawStoreChart) {
          win.drawStoreChart();
          win.drawCategoryChart();
        }
      }
    } catch (e) {}
    
    // 2. postMessage communication
    try {
      if (iframe.contentWindow) {
        iframe.contentWindow.postMessage({ action: 'setTheme', isLight: isLightVal }, '*');
      }
    } catch (e) {}
  });
}

// Attach load event listeners to iframes to apply theme when they load
document.querySelectorAll('iframe').forEach(iframe => {
  iframe.addEventListener('load', () => {
    setTimeout(() => {
      applyThemeToIframes(isLight);
      
      // Also send active sub-tab if this is the first iframe
      if (iframe.id === 'f0_iframe' && currentSubTab) {
        iframe.contentWindow.postMessage({ action: 'switchSubTab', tab: currentSubTab }, '*');
      }
    }, 150);
  });
});

// 3. Navigation and tab switching
let activeMainTab = 0;
let currentSubTab = 'xuat';

function switchMainTabParent(index) {
  activeMainTab = index;
  
  // Update Active UI class on sidebar
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
    item.classList.remove('active');
  });
  document.querySelectorAll('.sub-nav-item').forEach(item => {
    item.classList.remove('active');
  });
  
  const group = document.getElementById("groupForecast");
  if (index === 0) {
    group.classList.add('active');
    // Select first sub nav item as active
    const firstSubItem = document.querySelector('.sub-nav-item');
    if (firstSubItem) {
      firstSubItem.classList.add('active');
    }
  } else {
    group.classList.remove('active');
    if (index === 1) {
      document.getElementById('menuClaim').classList.add('active');
      document.getElementById('pageTitle').textContent = "📋 Báo Cáo Claim ABA";
    } else if (index === 2) {
      document.getElementById('menuDoiSoat').classList.add('active');
      document.getElementById('pageTitle').textContent = "🔍 Đối Soát Xuất Hàng";
    }
  }
  
  // Show active iframe wrapper
  document.querySelectorAll('.frame-wrap').forEach((f, j) => {
    f.classList.toggle('active', j === index);
  });
  
  // Load iframes lazily
  if (index === 1) {
    const f1 = document.getElementById('f1_iframe');
    if (f1.src === 'about:blank' || f1.src === '') {
      f1.src = 'external/claim_aba.html?v=' + Date.now();
    }
  }
  if (index === 2) {
    const f2 = document.getElementById('f2_iframe');
    if (f2.src === 'about:blank' || f2.src === '') {
      f2.src = 'external/doi_soat/index.html?v=' + Date.now();
    }
  }
}

function switchSubTabParent(subTabName, element) {
  currentSubTab = subTabName;
  activeMainTab = 0;
  
  // Title mapping
  const titles = {
    xuat: "📦 Báo Cáo Sản Lượng Đông Mát — Xuất Hàng",
    nhap: "📦 Báo Cáo Sản Lượng Đông Mát — Nhập Hàng",
    chitiet: "⚠️ Báo Cáo Sản Lượng Đông Mát — Chi Tiết Rớt Hàng",
    dapung: "📊 Báo Cáo Sản Lượng Đông Mát — Tỷ Lệ Đáp Ứng",
    forecast: "🔮 Báo Cáo Sản Lượng Đông Mát — Capacity Forecast"
  };
  
  document.getElementById('pageTitle').textContent = titles[subTabName] || "Báo Cáo Sản Lượng Đông Mát";
  
  // Set Active Classes
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
    item.classList.remove('active');
  });
  document.getElementById('groupForecast').classList.add('active');
  
  document.querySelectorAll('.sub-nav-item').forEach(item => {
    item.classList.remove('active');
  });
  element.classList.add('active');
  
  // Show tab 1 iframe
  document.querySelectorAll('.frame-wrap').forEach((f, j) => {
    f.classList.toggle('active', j === 0);
  });
  
  // Load iframe 1 if empty
  const f0 = document.getElementById('f0_iframe');
  if (f0.src === 'about:blank' || f0.src === '') {
    f0.src = 'external/nhap_xuat_dm.html?v=' + Date.now();
  } else {
    // Send postMessage to sub-tab
    try {
      if (f0.contentWindow) {
        f0.contentWindow.postMessage({ action: 'switchSubTab', tab: subTabName }, '*');
      }
    } catch (e) {}
  }
}
</script>
</body>
</html>
