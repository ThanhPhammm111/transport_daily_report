<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báo Cáo Sản Lượng Đông Mát</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0d12;
  --bg2: #111420;
  --bg3: #181c2a;
  --bg-head: #0d1020;
  --bg-row1: #12152200;
  --bg-row2: rgba(255,255,255,0.015);
  --border: #1e2236;
  --border-cat: #2a2f48;
  --txt: #d8dce6;
  --txt2: #7d849c;
  --txt3: #4e5470;
  /* Unified colors */
  --label-cat: #d8dce6;
  --label-info: #d8dce6;
  --num: #22d3ee;
  --num-hi: #22d3ee;
  --num-fc: #22d3ee;
  /* Percentage */
  --pct-good: #22d3ee;
  --pct-warn: #22d3ee;
  --pct-bad: #22d3ee;
  --pct-over: #22d3ee;
  /* Highlight */
  --cyan: #22d3ee;
  --cyan-bg: rgba(34,211,238,0.10);
  --yellow: #fde047;
  --yellow-bg: rgba(253,224,71,0.12);
  --green: #22d3ee;
  --red: #22d3ee;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --pick-ok: #22d3ee;
  --pick-warn: #22d3ee;
  --pick-bad: #22d3ee;
}
body.light-mode {
  --bg: #f8fafc;
  --bg2: #ffffff;
  --bg3: #f1f5f9;
  --bg-head: #e2e8f0;
  --bg-row1: rgba(0,0,0,0);
  --bg-row2: rgba(0,0,0,0.015);
  --border: #cbd5e1;
  --border-cat: #94a3b8;
  --txt: #0f172a;
  --txt2: #475569;
  --txt3: #64748b;
  --label-cat: #0f172a;
  --label-info: #334155;
  --num: #0284c7;
  --num-hi: #0284c7;
  --num-fc: #0284c7;
  --pct-good: #0284c7;
  --pct-warn: #0284c7;
  --pct-bad: #0284c7;
  --pct-over: #0284c7;
  --cyan: #0284c7;
  --cyan-bg: rgba(2,132,199,0.08);
  --yellow: #ca8a04;
  --yellow-bg: rgba(202,138,4,0.08);
  --green: #16a34a;
  --red: #dc2626;
  --blue: #2563eb;
  --purple: #7c3aed;
  --pick-ok: #16a34a;
  --pick-warn: #ca8a04;
  --pick-bad: #dc2626;
}
* { margin:0; padding:0; box-sizing:border-box; }
body.in-iframe .header-scm, body.in-iframe .tab-nav { display: none !important; }
body.screenshot-mode-table1 .header-scm, body.screenshot-mode-table1 .tab-nav, body.screenshot-mode-table1 .day-nav,
body.screenshot-mode-table2 .header-scm, body.screenshot-mode-table2 .tab-nav, body.screenshot-mode-table2 .day-nav { display: none !important; }
body.screenshot-mode-table1, body.screenshot-mode-table2 { padding: 0 !important; margin: 0 !important; min-height: auto !important; background: var(--bg) !important; }
body.screenshot-mode-table1 .container, body.screenshot-mode-table2 .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
body.screenshot-mode-table1 .table-block, body.screenshot-mode-table2 .table-block { box-shadow: none !important; margin: 0 !important; padding: 0 !important; }
body.screenshot-mode-table3 .filter-block, body.screenshot-mode-table3 #warning-section { display: none !important; }
body.screenshot-mode-table3 { padding-bottom: 0 !important; }
body.screenshot-mode-table3 .table-block { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; background: transparent !important; }
body.screenshot-mode-table3 .detail-block { max-width: 100% !important; }
body.in-iframe { padding-bottom: 20px !important; }
body {
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--txt);
  min-height:100vh;
  padding-bottom:60px;
}

/* Header SCM Style */
.header-scm {
  display: flex;
  height: 64px;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.header-scm-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-tag {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--cyan);
  border-right: 1px solid var(--border);
  padding-right: 12px;
}
.header-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--txt);
}
.theme-toggle-btn {
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--txt);
  cursor: pointer;
  transition: background-color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.theme-toggle-btn:hover {
  background: rgba(255,255,255,0.05);
}
body.light-mode .theme-toggle-btn:hover {
  background: rgba(0,0,0,0.04);
}
body.screenshot-mode-table3 .header-scm { display: none !important; }
body.in-iframe .header-scm { display: none !important; }

/* Day Nav */
.day-nav {
  display:flex; align-items:center; justify-content:center; gap:20px;
  padding:14px 28px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:50;
  backdrop-filter:blur(8px);
}
.day-nav button {
  background:var(--bg3); border:1px solid var(--border); color:var(--txt);
  padding:9px 20px; border-radius:8px; font-family:'Inter'; font-size:13px;
  font-weight:600; cursor:pointer; transition:all .2s;
}
.day-nav button:hover { background:#252a40; border-color:var(--cyan); color:var(--cyan); }
.day-nav button:disabled { opacity:.25; cursor:default; }
.day-info { text-align:center; min-width:200px; }
.day-info .date { font-size:22px; font-weight:800; color:var(--cyan); }
.day-info .dow { font-size:13px; color:var(--txt2); margin-top:2px; }
.day-info .week {
  font-size:10px; color:var(--bg); margin-top:4px;
  background:var(--cyan); padding:2px 10px; border-radius:10px;
  display:inline-block; font-weight:700; letter-spacing:0.5px;
}

/* Table */
.table-block {
  margin:16px auto;
  max-width:920px;
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,0.25);
}
.table-title {
  padding:10px 16px;
  font-size:13px; font-weight:700;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.02);
  color:var(--txt);
}
table {
  width:100%; border-collapse:collapse; font-size:12px;
  table-layout:fixed;
}

/* Column widths */
col.col-cat    { width:115px; }
col.col-info   { width:115px; }
col.col-num    { width:82px; }
col.col-pct    { width:82px; }
col.col-qclh   { width:68px; }

thead th {
  background:var(--bg-head);
  color:var(--txt2);
  font-weight:600; font-size:10px;
  text-transform:uppercase; letter-spacing:0.5px;
  padding:6px 8px;
  text-align:right;
  border-bottom:2px solid var(--border-cat);
  white-space:nowrap;
  overflow:hidden;
}
th.h-cat, th.h-info { text-align:left; }
th.h-cat { padding-left:12px; }
th.date-head {
  background:linear-gradient(135deg,#0c3d5e,#134050);
  color:var(--cyan);
  font-size:13px; font-weight:700;
  text-align:center;
  letter-spacing:0;
  text-transform:none;
  padding:8px 6px;
}

tbody td {
  padding:5px 8px;
  border-bottom:1px solid rgba(30,34,54,0.6);
  text-align:right;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  height:30px;
  vertical-align:middle;
  overflow:hidden;
}

/* Class-based column styling (fixes rowspan alignment) */
.c-cat { text-align:left !important; font-weight:700; color:var(--txt); padding-left:12px !important; font-size:11.5px; letter-spacing:0.2px; }
.c-info { text-align:left !important; color:var(--txt); font-weight:500; font-size:11px; }
.c-bk { color:var(--cyan); font-weight:600; }
.c-fc { color:var(--cyan); font-weight:500; }
.c-pct { color:var(--cyan); font-weight:600; }
.c-ql { color:var(--cyan); font-weight:600; }
.c-bt { color:var(--cyan); font-weight:500; }
.c-tx { color:var(--cyan); font-weight:600; }
.c-pk { color:var(--cyan); font-weight:600; }
.c-empty { color:var(--txt3); }

/* Hover */
tbody tr:hover td { background:rgba(94,234,212,0.04) !important; }

/* Category group separator */
tbody tr.cat-first td { border-top:2px solid var(--border-cat); }
tbody tr.cat-first td.c-cat { border-top-color:var(--label-cat); }

/* Zebra per row within category group */
tbody tr.row-2 td { background:var(--bg-row2); }
tbody tr.row-3 td { background:rgba(255,255,255,0.025); }

/* Summary rows */
tbody tr.summary td {
  background:rgba(96,165,250,0.05) !important;
  font-weight:700;
  border-bottom:1px solid rgba(96,165,250,0.15);
}
tbody tr.summary.cat-first td {
  border-top:3px solid var(--blue);
}
tbody tr.summary td.c-cat {
  color:var(--txt) !important;
  font-size:12.5px;
}
tbody tr.summary td.c-info {
  color:var(--txt) !important;
  font-weight:600;
  font-style:italic;
}
tbody tr.summary td.c-bk { color:var(--cyan) !important; }
tbody tr.summary td.c-tx { color:var(--cyan) !important; }

/* Highlight cells */
.hl-cyan {
  background:var(--cyan-bg) !important;
  color:var(--cyan) !important;
  font-weight:700;
  border-radius:4px;
}
.hl-yellow {
  background:var(--cyan-bg) !important;
  color:var(--cyan) !important;
  font-weight:700;
  border-radius:4px;
}
.pct-warn {
  background:rgba(253,224,71,0.18) !important;
  color:#fde047 !important;
  font-weight:700;
}
.pct-normal {
  color:var(--cyan) !important;
  font-weight:600;
}

/* Pick rot coloring */
.pick-ok  { color:var(--cyan); }
.pick-warn { background:rgba(253,224,71,0.18) !important; color:#fde047 !important; font-weight:700; }

/* Empty cell */
.empty-cell { color:var(--txt3); }

/* Off day */
.off-msg {
  padding:50px; text-align:center; color:var(--txt3); font-size:16px; font-style:italic;
}

/* Footer legend */
.legend {
  display:flex; gap:24px; justify-content:center; padding:18px;
  font-size:11px; color:var(--txt3);
  flex-wrap:wrap;
}
.legend span { display:flex; align-items:center; gap:6px; }
.legend .dot { width:10px; height:10px; border-radius:3px; display:inline-block; }

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:#2a2f48; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#3a3f58; }

@keyframes fadeIn {
  from { opacity:0; transform:translateY(6px); }
  to { opacity:1; transform:translateY(0); }
}
.table-block { animation:fadeIn 0.3s ease; }

/* Báº£ng 3 - Chi tiáº¿t */
.detail-block { max-width:1260px !important; }
.detail-block .detail-wrap { overflow-x:auto; }
.detail-table { font-size:11.5px; table-layout:fixed !important; width:100%; min-width:1200px; }
.detail-table thead th {
  font-size:10px; padding:8px 6px;
  background:linear-gradient(135deg,#0c3d5e,#134050);
  color:var(--cyan); font-weight:700;
  border-bottom:2px solid rgba(34,211,238,0.3);
  text-transform:uppercase; letter-spacing:0.4px;
  white-space:nowrap;
}
.detail-table thead th:first-child { text-align:center; width:35px; }
.detail-table thead th.th-date { text-align:center; width:65px; }
.detail-table thead th.th-cat { text-align:left; width:100px; }
.detail-table thead th.th-temp { text-align:center; width:55px; }
.detail-table thead th.th-code { text-align:left; width:110px; }
.detail-table thead th.th-name { text-align:left; width:auto; }
.detail-table thead th.th-unit { text-align:center; width:50px; }
.detail-table thead th.th-num { width:75px; }
.detail-table thead th.th-note { text-align:left; width:150px; }
.detail-table thead th.th-tf { width:50px; }
.detail-table thead th.th-pct { width:80px; }
.detail-table tbody td {
  padding:6px 6px; height:32px;
  border-bottom:1px solid rgba(30,34,54,0.7);
  overflow:hidden; text-overflow:ellipsis;
  vertical-align:middle;
}
.detail-table tbody td:first-child { text-align:center; color:var(--txt); font-size:11px; font-weight:600; }
.detail-table tbody td.d-date { text-align:center; font-size:11px; font-weight:600; color:var(--cyan); }
.detail-table tbody td.d-cat { text-align:left; font-size:11px; color:var(--txt); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.detail-table tbody td.d-temp { text-align:center; font-size:11px; font-weight:700; color:var(--txt); }
.detail-table tbody td.d-code { text-align:left; font-size:11px; color:#9aa0b0; font-family:'Consolas', 'Courier New', monospace; font-weight:500; overflow:hidden; text-overflow:ellipsis; }
.detail-table tbody td.d-name { text-align:left; color:var(--txt); font-size:12px; font-weight:500; white-space:normal; line-height:1.4; }
.detail-table tbody td.d-unit { text-align:center; color:var(--txt); font-size:11px; }
.d-bk { color:var(--cyan) !important; font-weight:700; font-size:11.5px; }
.d-tx { color:var(--cyan) !important; font-weight:600; font-size:11.5px; }
.d-qcr { color:var(--cyan) !important; font-weight:500; font-size:11.5px; }
.d-hold { color:var(--cyan) !important; font-weight:500; font-size:11.5px; }
.d-diff { color:#ef4444 !important; font-weight:700; font-size:11.5px; }
.d-note { color:#fbbf24 !important; font-weight:700; font-size:11px !important; text-align:left !important; }
.d-tf { color:var(--txt) !important; font-size:10px !important; font-weight:600; }
.d-pct-good { color:var(--cyan) !important; font-weight:600; font-size:11px; }
.d-pct-warn { color:var(--cyan) !important; font-weight:700; font-size:11px; }
.d-pct-bad { color:var(--cyan) !important; font-weight:700; font-size:11px; }
.detail-table tbody tr:nth-child(odd) td { background:rgba(255,255,255,0.018); }
.detail-table tbody tr:nth-child(even) td { background:rgba(14,17,30,0.5); }
.detail-table tbody tr:hover td { background:rgba(94,234,212,0.06) !important; }
.detail-total td { background:rgba(96,165,250,0.06) !important; font-weight:700 !important; border-top:1px solid rgba(96,165,250,0.2); }
.detail-total td.d-name { color:var(--blue) !important; font-style:italic; }
.summary-cards { display:flex; gap:12px; padding:12px 0 8px; flex-wrap:wrap; justify-content:center; }
.s-card {
  background:linear-gradient(135deg, rgba(24,28,42,0.95), rgba(17,20,32,0.95));
  border:1.5px solid var(--border);
  border-radius:10px; padding:10px 18px; text-align:center; min-width:110px;
  transition:transform 0.2s, box-shadow 0.2s;
}
.s-card:hover { transform:translateY(-2px); }
.s-card .s-label { font-size:9px; text-transform:uppercase; letter-spacing:0.6px; color:var(--txt2); font-weight:700; }
.s-card .s-val { font-size:18px; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums; }

/* SKU rá»›t " purple */
.s-card.sc-sku { border-color:rgba(167,139,250,0.5); box-shadow:0 0 12px rgba(167,139,250,0.15); }
.s-card.sc-sku .s-val { color:#c4b5fd; text-shadow:0 0 8px rgba(167,139,250,0.4); }

/* Booking " cyan */
.s-card.sc-bk { border-color:rgba(34,211,238,0.5); box-shadow:0 0 12px rgba(34,211,238,0.15); }
.s-card.sc-bk .s-val { color:#22d3ee; text-shadow:0 0 8px rgba(34,211,238,0.4); }

/* Thá»±c xuáº¥t " green */
.s-card.sc-tx { border-color:rgba(52,211,153,0.5); box-shadow:0 0 12px rgba(52,211,153,0.15); }
.s-card.sc-tx .s-val { color:#34d399; text-shadow:0 0 8px rgba(52,211,153,0.4); }

/* ChÃªnh lá»‡ch " orange/amber */
.s-card.sc-diff { border-color:rgba(251,146,60,0.5); box-shadow:0 0 12px rgba(251,146,60,0.15); }
.s-card.sc-diff .s-val { color:#fb923c; text-shadow:0 0 8px rgba(251,146,60,0.4); }

/* %TX/BK " yellow */
.s-card.sc-pct { border-color:rgba(253,224,71,0.5); box-shadow:0 0 12px rgba(253,224,71,0.15); }
.s-card.sc-pct .s-val { color:#fde047; text-shadow:0 0 8px rgba(253,224,71,0.4); }
.badge-cat { font-size:9px; padding:2px 8px; border-radius:8px; font-weight:700; margin-left:6px; }
.badge-lh { background:rgba(167,139,250,0.15); color:var(--purple); }
.badge-qc { background:rgba(251,191,36,0.15); color:var(--yellow); }
.badge-tcnk { background:rgba(251,146,60,0.15); color:#fb923c; }

/* Bảng 4 - Warning */
.warn-block { max-width:1260px !important; }
.warn-block .warn-title-bar {
  padding:10px 16px;
  font-size:13px; font-weight:700;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:8px;
  background:rgba(239,68,68,0.06);
  color:#f87171;
}
.warn-table { width:100%; border-collapse:collapse; font-size:11.5px; table-layout:fixed; }
.warn-table thead th {
  font-size:10px; padding:8px 6px;
  background:linear-gradient(135deg,#3b1320,#2d1018);
  color:#f87171; font-weight:700;
  border-bottom:2px solid rgba(248,113,113,0.3);
  text-transform:uppercase; letter-spacing:0.4px;
  white-space:nowrap;
  text-align:center;
}
.warn-table thead th:first-child { width:32px; }
.warn-table thead th.wt-code { width:110px; }
.warn-table thead th.wt-name { width:auto; }
.warn-table thead th.wt-cat { width:85px; }
.warn-table thead th.wt-num { width:72px; }
.warn-table thead th.wt-days { width:56px; }
.warn-table tbody td {
  padding:6px 8px; height:32px;
  border-bottom:1px solid rgba(248,113,113,0.1);
  overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  vertical-align:middle;
}
.warn-table tbody td:first-child { text-align:center; color:var(--txt); font-size:11px; font-weight:700; vertical-align:middle; }
.warn-table tbody td.wc-code { text-align:left; font-size:10.5px; color:var(--txt); font-weight:600; vertical-align:middle; }
.warn-table tbody td.wc-name { text-align:left; color:var(--txt); font-size:11px; font-weight:500; white-space:normal; vertical-align:middle; }
.warn-table tbody td.wc-cat { text-align:center; font-size:10.5px; color:var(--txt); font-weight:500; vertical-align:middle; }
.warn-table tbody td.wc-num { text-align:center; color:var(--cyan); font-weight:700; font-size:11px; }
.warn-table tbody td.wc-days {
  text-align:center; font-weight:800; font-size:15px; vertical-align:middle;
}
.wc-days-3 { color:#fb923c; }
.wc-days-4 { color:#f87171; }
.wc-days-5 { color:#ef4444; text-shadow:0 0 8px rgba(239,68,68,0.5); }
.warn-table tbody td.wc-dates { text-align:center; font-size:11px; color:#93c5fd; font-weight:600; }
.warn-table tbody tr:nth-child(odd) td { background:rgba(248,113,113,0.03); }
.warn-table tbody tr:nth-child(even) td { background:rgba(14,17,30,0.5); }
.warn-table tbody tr:hover td { background:rgba(248,113,113,0.08) !important; }
/* Separator between SKU groups */
.warn-table tbody tr.warn-group-first td { border-top:2px solid rgba(248,113,113,0.25); }
.warn-badge {
  display:inline-block; padding:3px 10px; border-radius:10px;
  font-size:11px; font-weight:800;
  background:rgba(248,113,113,0.15); color:#f87171;
  margin-left:8px;
}
/* Tab navigation */
.tab-nav {
  display:flex; justify-content:center; gap:8px;
  padding:10px 16px; background:var(--bg2);
  border-bottom:1px solid var(--border);
  overflow-x:auto; flex-wrap:nowrap;
}
.tab-btn {
  padding:8px 16px; font-family:'Inter'; font-size:11px; font-weight:700;
  background:transparent; border:none; color:var(--txt2); cursor:pointer;
  border-radius:8px; transition:all .2s;
  letter-spacing:0.5px; text-transform:uppercase;
  white-space:nowrap; display:flex; align-items:center; gap:6px;
}
.tab-btn:hover { color:var(--txt); background:rgba(255,255,255,0.05); }
body.light-mode .tab-btn:hover { background:rgba(0,0,0,0.04); }

// === HELPERS ===
let curIdx = D.length - 1; // Start at last day with data
let currentTab = 'xuat';
let nhapIdx = 0; // Will be set after DN is defined

function fmt(n) {
  if (n===0||n===null||n===undefined||!isFinite(n)) return '—';
  return Math.round(n).toLocaleString('en-US');
}
function fmtD(n,d) { return (n===0||!isFinite(n))?'—':n.toFixed(d||0); }

function bkTon(tx, pick) {
  if(tx===0) return 0;
  if(pick>=100) return 0;
  if(pick===0) return tx;
  return Math.round(tx / (1 - pick/100));
}

function pctCls(v) {
  if(v > 115 || (v > 0 && v < 85)) return 'pct-warn';
  return 'pct-normal';
}

function pickCls(v) {
  const a = Math.abs(v);
  if(a > 1) return 'pick-warn';
  return 'pick-ok';
}

function fmtPick(v) {
  const cls = pickCls(v);
  const txt = v !== 0 ? fmtD(v,2)+'%' : '0.00%';
  return `<span class="${cls}">${txt}</span>`;
}

// Render a category row group (3 rows: SKU, ITEM, kg)
function catRows(label, c, isFirst) {
  if (!Array.isArray(c) || c.length < 13) return '';
  const cls1 = isFirst ? ' class="cat-first"' : '';
  const sku_bkTon = bkTon(c[1], c[2]);
  const item_bkTon = bkTon(c[6], c[7]);
  const kg_bkTon = bkTon(c[11], c[12]);

  return `
  <tr${cls1}>
    <td class="c-cat" rowspan="3">${label}</td>
    <td class="c-info">So lượng SKU</td>
    <td class="c-bk">${fmt(c[0])}</td><td class="c-fc c-empty"></td><td class="c-pct c-empty"></td><td class="c-ql c-empty"></td>
    <td class="c-bt">${fmt(sku_bkTon)}</td><td class="c-tx">${fmt(c[1])}</td><td class="c-pk ${pickCls(c[2])}">${fmtPick(c[2])}</td>
  </tr>
  <tr class="row-2">
    <td class="c-info">So lượng (ITEM)</td>
    <td class="c-bk">${fmt(c[3])}</td><td class="c-fc">${fmt(c[4])}</td>
    <td class="c-pct ${pctCls(c[5])}">${c[5]?fmtD(c[5],2)+'%':'—'}</td><td class="c-ql c-empty"></td>
    <td class="c-bt">${fmt(item_bkTon)}</td><td class="c-tx">${fmt(c[6])}</td><td class="c-pk ${pickCls(c[7])}">${fmtPick(c[7])}</td>
  </tr>
  <tr class="row-3">
    <td class="c-info">Trọng lượng (kg)</td>
    <td class="c-bk">${fmt(c[8])}</td><td class="c-fc">${fmt(c[9])}</td>
    <td class="c-pct ${pctCls(c[10])}">${c[10]?fmtD(c[10],2)+'%':'—'}</td><td class="c-ql c-empty"></td>
    <td class="c-bt">${fmt(kg_bkTon)}</td><td class="c-tx">${fmt(c[11])}</td><td class="c-pk ${pickCls(c[12])}">${fmtPick(c[12])}</td>
  </tr>`;
}

      <th>Booking</th><th>FC</th><th>%Booking/FC</th><th>%QC & LH</th>
      <th>Bk theo tồn</th><th>Thực xuất</th><th>Tỉ lệ pick rớt</th>
    </tr>
  </thead>`;
}

// Compute Table 2 derived categories
function computeT2(day) {
  const q=day.qc, m=day.mat, tqc=day.tqc, tlh=day.tlh;
  // tcnk combined = tqc + tlh
  const tcnk = [];
  for(let i=0;i<13;i++) {
    if(i===5 || i===10) { // pct fields - recompute
      const bk = tqc[i-2]+tlh[i-2];
      const fc = tqc[i-1]+tlh[i-1];
      tcnk[i] = fc>0 ? Math.round(bk/fc*10000)/100 : 0;
    } else {
      tcnk[i] = tqc[i]+tlh[i];
    }
  }
  // matLH = mat - qc (matQC = qc)
  const matLH = [];
  for(let i=0;i<13;i++) {
    if(i===5 || i===10) { // pct - recompute
      const bk = m[i-2]-q[i-2];
      const fc = m[i-1]-q[i-1];
      matLH[i] = fc>0 ? Math.round(bk/fc*10000)/100 : 0;
    } else if(i===2 || i===7 || i===12) { // pick - recompute
      const tx = m[i-1]-q[i-1];
      const bt = bkTon(tx, 0); // will compute later via rendering
      // Actually pick = (bkTon-tx)/bkTon, hard to compute without bkTon
      // Let's just compute from mat/qc bkTon difference
      const m_bt = bkTon(m[i-1], m[i]);
      const q_bt = bkTon(q[i-1], q[i]);
      const lh_bt = m_bt - q_bt;
      const lh_tx = m[i-1] - q[i-1];
      matLH[i] = lh_bt > 0 ? Math.round((lh_bt-lh_tx)/lh_bt*10000)/100 : 0;
    } else {
      matLH[i] = m[i]-q[i];
    }
  }
  return { tcnk, matQC:q, matLH, tcnkLH:tlh, tcnkQC:tqc };
}

// === RENDER ===
function render() {
  const day = D[curIdx];
  if (!day) {
    document.getElementById('content').innerHTML = '<div class="table-block">Lỗi: Không tìm thấy dữ liệu ngày này.</div>';
    return;
  }
  document.getElementById('navDate').textContent = day.d || '';
  document.getElementById('navDow').textContent = day.w || '';
  document.getElementById('navWeek').textContent = day.wk || '';
  document.getElementById('btnPrev').disabled = curIdx === 0;
  document.getElementById('btnNext').disabled = curIdx === D.length-1;

  if (day.off) {
    document.getElementById('content').innerHTML = `
      <div class="table-block"><div class="off-msg">— ${day.d} (${day.w}) — Ngày nghỉ, không có dữ liệu</div></div>`;
    return;
  }

  const t2 = computeT2(day);

  let html = `
  <div class="table-block" id="blockTable1">
    <div class="table-title">📦 Theo Loại Hàng</div>
    <table>${tableHead(day)}<tbody>
      ${catRows('Hàng Quá Cảnh', day.qc, true)}
      ${catRows('Hàng Lưu Kho', day.lk, true)}
      ${catRows('TCNK Quá Cảnh', day.tqc, true)}
      ${catRows('TCNK Lưu Hàng', day.tlh, true)}
      ${sumRows(day)}
    </tbody></table>
  </div>

  <div class="table-block" id="blockTable2">
    <div class="table-title">🌡 Tính Chất Hàng</div>
    <table>${tableHead(day)}<tbody>
      ${catRows('Đông', day.dong, true)}
      ${catRows('Mát', day.mat, true)}
      ${catRows('TCNK', t2.tcnk, true)}
      ${catRows('Mát quá cảnh', t2.matQC, true)}
      ${catRows('Mát lưu Hàng', t2.matLH, true)}
      ${catRows('TCNK lưu hàng', t2.tcnkLH, true)}
      ${catRows('TCNK quá cảnh', t2.tcnkQC, true)}
    </tbody></table>
  </div>`;

  document.getElementById('content').innerHTML = html;
  const urlParams = new URLSearchParams(window.location.search);
  const shot = urlParams.get('screenshot');
  if (shot === 'table1' || shot === 'table2') {
    document.body.classList.add('screenshot-mode-' + shot);
    if (shot === 'table1') {
      const b2 = document.getElementById('blockTable2'); if (b2) b2.style.display = 'none';
    } else {
      const b1 = document.getElementById('blockTable1'); if (b1) b1.style.display = 'none';
    }
  }
}

  uniqueDates.sort((a, b) => {
    const partsA = a.split('-');
    const partsB = b.split('-');

    const dayB = parseInt(partsB[0]);
    const monthA = monthOrder[partsA[1]] || 0;

    if (monthA !== monthB) return monthB - monthA;
    return dayB - dayA;
  });

function exportCtToExcel() {
  const items = window.ctFilteredItems || [];
  if (items.length === 0) {
    alert('Kh\u00f4ng c\u00f3 d\u1eef li\u1ec7u \u0111\u1ec3 xu\u1ea5t!');
    return;
  }
  const headers = ['Nga\u0300y', 'Loa\u0323i ha\u0300ng', 'Ha\u0300ng', 'Code', 'T\u00ean sa\u0309n ph\u00e2\u0309m', '\u0110VT', 'Booking', 'S\u1ed1 Xu\u00e2\u0301t', 'Nh\u00e2\u0323p QC', 'Ha\u0300ng QC r\u01a1\u0301t', 'Hold', 'SL pick r\u01a1\u0301t', 'Ghi chu\u0301', 'T/F', 'Ti\u0309 l\u00ea\u0323 Pick'];
  const csvRows = [headers.join(',')];
  items.forEach(it => {
    const f = v => {
      if (v === null || v === undefined) return '';
      let s = String(v);
      if (s.includes(',') || s.includes('"') || s.includes('\n') || s.includes('\r')) {
        s = '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    };
    const row = [
      f(it.date), f(it.cat), f(it.temp), f(it.code), f(it.name), f(it.unit),
      f(it.bk), f(it.sx), f(it.nqc), f(it.qcr), f(it.hold), f(it.diff),
      f(it.note), f(it.diff > 0 ? 'FALSE' : 'TRUE'),
      f(it.pct > 0 ? (it.pct.toFixed(2) + '%') : '0.00%')
    ];
    csvRows.push(row.join(','));
  });
  const csvContent = '\uFEFF' + csvRows.join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  let filename = 'Chi_Tiet_Rot_Hang';
  if (window.ctFilterDate && window.ctFilterDate !== 'all') { filename += '_' + window.ctFilterDate; }
  if (window.ctFilterCode) { filename += '_code_' + window.ctFilterCode; }
  filename += '.csv';
  link.setAttribute('download', filename);
  link.style.visibility = 'hidden';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
function prev() {

  else { if(daIdx>0){daIdx--;renderDapUng();window.scrollTo(0,0);} }
}
function next() {
  if (currentTab === 'xuat') { if(curIdx<D.length-1){curIdx++;render();window.scrollTo(0,0);} }
  else if (currentTab === 'nhap') { if(nhapIdx<DN.length-1){nhapIdx++;renderNhap();window.scrollTo(0,0);} }
  else if (currentTab === 'chitiet') { if(curIdx<D.length-1){curIdx++;renderChiTiet();window.scrollTo(0,0);} }
  else { if(daIdx<DA.length-1){daIdx++;renderDapUng();window.scrollTo(0,0);} }
}

    return Array.from(tr.querySelectorAll('td')).map(td => td.innerText.trim().replace(/\n/g, ' '));
  });
  
  const modeName = summaryViewMode === 'day' ? 'Theo_Ngay' : summaryViewMode === 'week' ? 'Theo_Tuan' : 'Theo_Thang';
  const filename = `Tong_Hop_Thuc_Xuat_${modeName}.csv`;
  
  let csv = '\uFEFF' + headers.join(',') + '\r\n';
  exportRows.forEach(row => {
    if (row.length >= 2) {
      csv += row.map(v => typeof v === 'string' && (v.includes(',') || v.includes('"')) ? `"${v.replace(/"/g, '""')}"` : v).join(',') + '\r\n';
    }
  });
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

  DNH.forEach(day => {

    const wk = day.wk;
    if (!weeklySums.has(wk)) {
      weeklySums.set(wk, {
        item: { quaCanh: 0, mat: 0, dong: 0 },
        kg: { quaCanh: 0, mat: 0, dong: 0 }
      });
    }
    const wCur = weeklySums.get(wk);
    wCur.item.quaCanh += (day.qc || 0);
    wCur.item.mat += (day.mat || 0);
    wCur.item.dong += (day.dong || 0);
    wCur.kg.quaCanh += (day.kgQc || 0);
    wCur.kg.mat += (day.kgMat || 0);
    wCur.kg.dong += (day.kgDong || 0);

    // --- MONTHLY SUMS ---

function renderTongHopXuat() {
  const container = document.getElementById('content');
  if (!container) return;

  let groupId = 0;
  const rowsWithGroup = D.map((day, idx) => {
    const isMon = day.w === 'Mon' || day.w === 'T2';
    if (isMon && idx > 0) groupId++;
    return { day, groupId };
  });

  const weeklySums = new Map();
  rowsWithGroup.forEach(({ day, groupId }) => {
    const isMon = day.w === 'Mon' || day.w === 'T2';
    if (isMon) return;

    if (!weeklySums.has(groupId)) {
      const weekDays = rowsWithGroup.filter(g => g.groupId === groupId);
      const monDay = weekDays.find(g => g.day.w === 'Mon' || g.day.w === 'T2');
      const labelDay = monDay ? monDay.day : weekDays[0].day;
      const label = 'Tuần ' + labelDay.d;
      weeklySums.set(groupId, {
        label,
        item: { quaCanh: 0, mat: 0, dong: 0 },
        kg: { quaCanh: 0, mat: 0, dong: 0 }
      });
    }

    const qc = day.qc || Array(13).fill(0);
    const tqc = day.tqc || Array(13).fill(0);
    const mat = day.mat || Array(13).fill(0);
    const tlh = day.tlh || Array(13).fill(0);
    const dong = day.dong || Array(13).fill(0);

    const qcItem = (qc[6] || 0) + (tqc[6] || 0);
    const qcKg = (qc[11] || 0) + (tqc[11] || 0);
    const matItem = ((mat[6] || 0) - (qc[6] || 0)) + (tlh[6] || 0);
    const matKg = ((mat[11] || 0) - (qc[11] || 0)) + (tlh[11] || 0);

    const cur = weeklySums.get(groupId);

    cur.item.mat += matItem;

            <th style="padding: 10px 12px; text-align: center; width: 60px;">Thứ</th>
            <th style="padding: 10px 12px; color: #38bdf8;">Item Quá Cảnh</th>
            <th style="padding: 10px 12px; color: #60a5fa;">Item Mát</th>
            <th style="padding: 10px 12px; color: #818cf8;">Item Đông</th>
            <th style="padding: 10px 12px; color: #38bdf8; background: rgba(56,189,248,0.08); font-weight: 800;">TỔNG ITEM</th>
            <th style="padding: 10px 12px; color: #f472b6;">Kg Quá Cảnh</th>
            <th style="padding: 10px 12px; color: #fb7185;">Kg Mát</th>
            <th style="padding: 10px 12px; color: #f43f5e;">Kg Đông</th>
            <th style="padding: 10px 12px; color: #f472b6; background: rgba(244,114,182,0.08); font-weight: 800;">TỔNG KG</th>
          </tr>
        </thead>
        <tbody>
  `;

  filteredRows.forEach(r => {
    const totalItem = r.item.quaCanh + r.item.mat + r.item.dong;
    const totalKg = r.kg.quaCanh + r.kg.mat + r.kg.dong;
    const rowBg = r.isHighlight ? 'background: rgba(16, 185, 129, 0.15); border-top: 2px solid rgba(16, 185, 129, 0.4); border-bottom: 2px solid rgba(16, 185, 129, 0.4); font-weight: 800;' : (r.off ? 'opacity: 0.5;' : '');
    const fmtN = (v) => v ? v.toLocaleString('vi-VN') : '—';
    const fmtKg = (v) => v ? v.toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : '—';

    h += `
      <tr style="border-bottom: 1px solid var(--sidebar-border, rgba(255,255,255,0.05)); ${rowBg}">
        <td style="padding: 10px 12px; text-align: left; font-weight: 800; ${r.isHighlight ? 'color: #10b981;' : ''}">${r.date}${r.isHighlight && summaryViewMode === 'day' ? ' <span style="font-size: 10px; color: #34d399; font-weight: 700;">(Tổng tuần)</span>' : ''}</td>
        <td style="padding: 10px 12px; text-align: center; color: #94a3b8;">${r.dow}</td>
        <td style="padding: 10px 12px;">${fmtN(r.item.quaCanh)}</td>
        <td style="padding: 10px 12px;">${fmtN(r.item.mat)}</td>
        <td style="padding: 10px 12px;">${fmtN(r.item.dong)}</td>
        <td style="padding: 10px 12px; background: rgba(56,189,248,0.05); font-weight: 800; color: #38bdf8;">${fmtN(totalItem)}</td>
        <td style="padding: 10px 12px;">${fmtKg(r.kg.quaCanh)}</td>
        <td style="padding: 10px 12px;">${fmtKg(r.kg.mat)}</td>
        <td style="padding: 10px 12px;">${fmtKg(r.kg.dong)}</td>
        <td style="padding: 10px 12px; background: rgba(244,114,182,0.05); font-weight: 800; color: #f472b6;">${fmtKg(totalKg)}</td>
      </tr>
    `;
  });

  h += `
        </tbody>
      </table>
    </div>
  </div>
  `;

  container.innerHTML = h;
}

function nhCatBlock(catLabel, arr, nccVal, isFirst) {
  let h = `<tr${isFirst?' class="cat-first"':''}>
    <td class="c-cat" rowspan="4">${catLabel}</td>`;
  h += `<td class="c-info">Số lượng NCC</td><td class="c-bk">${fmt(nccVal)}</td><td class="c-tx c-empty"></td><td class="c-pk c-empty"></td></tr>`;
  const skuPct = arr[0]>0 ? ((arr[0]-arr[1])/arr[0]*100) : 0;
  h += `<tr><td class="c-info">Số lượng SKU</td><td class="c-bk">${fmt(arr[0])}</td><td class="c-tx">${fmt(arr[1])}</td><td class="c-pk ${skuPct>1?'pick-warn':'pick-ok'}">${arr[0]>0?skuPct.toFixed(2)+'%':'0.00%'}</td></tr>`;
  const iPct = arr[2]>0 ? ((arr[2]-arr[3])/arr[2]*100) : 0;
  h += `<tr class="row-2"><td class="c-info">Số lượng (ITEM)</td><td class="c-bk">${fmt(arr[2])}</td><td class="c-tx">${fmt(arr[3])}</td><td class="c-pk ${iPct>1?'pick-warn':'pick-ok'}">${arr[2]>0?iPct.toFixed(2)+'%':'0.00%'}</td></tr>`;
  const kPct = arr[4]>0 ? ((arr[4]-arr[5])/arr[4]*100) : 0;
  h += `<tr class="row-3"><td class="c-info">Trọng lượng (kg)</td><td class="c-bk">${fmt(arr[4])}</td><td class="c-tx">${fmt(arr[5])}</td><td class="c-pk ${kPct>1?'pick-warn':'pick-ok'}">${arr[4]>0?kPct.toFixed(2)+'%':'0.00%'}</td></tr>`;
  return h;
}

function nhTableHead(day) {
  return `<colgroup>
    <col style="width:110px"><col style="width:120px">
    <col style="width:90px"><col style="width:90px"><col style="width:90px">
  </colgroup>
  <thead><tr><th class="h-cat" colspan="2"></th><th class="date-head" colspan="3">${day.d} — ${day.w}</th></tr>
  <tr><th class="h-cat">Loại hàng</th><th class="h-info">Thông tin</th><th>Booking</th><th>Thực nhập</th><th>Tỉ lệ rớt</th></tr></thead>`;
}

function renderNhap() {
  const day = DN[nhapIdx];
  if (!day) return;
  document.getElementById('navDate').textContent = day.d;
  document.getElementById('navDow').textContent = day.w;
  document.getElementById('navWeek').textContent = day.wk;
  document.getElementById('btnPrev').disabled = nhapIdx === 0;
  document.getElementById('btnNext').disabled = nhapIdx === DN.length-1;
  if (day.off) {
    document.getElementById('content').innerHTML = `<div class="table-block"><div class="off-msg">— ${day.d} (${day.w}) — Ngày nghỉ, không có dữ liệu</div></div>`;
    return;
  }
  const tiPct = day.ti[0]>0 ? ((day.ti[0]-day.ti[1])/day.ti[0]*100) : 0;
  const tsPct = day.ts[0]>0 ? ((day.ts[0]-day.ts[1])/day.ts[0]*100) : 0;
  const tkPct = day.tk[0]>0 ? ((day.tk[0]-day.tk[1])/day.tk[0]*100) : 0;
  const sumHtml = `
  <tr class="summary cat-first"><td class="c-cat" rowspan="3" style="vertical-align:top">TỔNG</td>
    <td class="c-info">Total ITEM</td><td class="c-bk">${fmt(day.ti[0])}</td><td class="c-tx">${fmt(day.ti[1])}</td><td class="c-pk ${tiPct>1?'pick-warn':'pick-ok'}">${tiPct.toFixed(2)}%</td></tr>
  <tr class="summary row-2"><td class="c-info">Total SKUs</td><td class="c-bk">${fmt(day.ts[0])}</td><td class="c-tx">${fmt(day.ts[1])}</td><td class="c-pk ${tsPct>1?'pick-warn':'pick-ok'}">${tsPct.toFixed(2)}%</td></tr>
  <tr class="summary row-3"><td class="c-info">Total trọng lượng</td><td class="c-bk">${fmt(day.tk[0])}</td><td class="c-tx">${fmt(day.tk[1])}</td><td class="c-pk ${tkPct>1?'pick-warn':'pick-ok'}">${tkPct.toFixed(2)}%</td></tr>`;
  let html = `<div class="table-block nh-cards">
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <div class="s-card" style="border-color:#f59e0b"><div class="s-label" style="color:#f59e0b">PO NCC giao</div><div class="s-val">${fmt(day.po)}</div></div>
      <div class="s-card" style="border-color:#22d3ee"><div class="s-label">Total ITEM Bk</div><div class="s-val">${fmt(day.ti[0])}</div></div>
      <div class="s-card" style="border-color:#22d3ee"><div class="s-label">Total ITEM Nhập</div><div class="s-val">${fmt(day.ti[1])}</div></div>
      <div class="s-card" style="border-color:${tiPct>1?'#f87171':'#22d3ee'}"><div class="s-label">Tỉ lệ rớt</div><div class="s-val" style="color:${tiPct>1?'#f87171':'#22d3ee'}">${tiPct.toFixed(2)}%</div></div>
      <div class="s-card" style="border-color:#a78bfa"><div class="s-label">Total SKUs</div><div class="s-val">${fmt(day.ts[0])} / ${fmt(day.ts[1])}</div></div>
    </div>
  </div>
  <div class="table-block nh-compact"><div class="table-title" style="color:#f59e0b">Ô Bảng 1 — Nhập hàng theo loại vận chuyển</div>
    <table>${nhTableHead(day)}<tbody>
    ${nhCatBlock('Hàng Quá Cảnh', day.qc, day.qcN, true)}
    ${nhCatBlock('Hàng Lưu Kho', day.lk, day.lkN, true)}
    ${nhCatBlock('TCNK Quá Cảnh', day.tqc, day.tqcN, true)}
    ${nhCatBlock('TCNK Lưu Hàng', day.tlh, day.tlhN, true)}
    ${sumHtml}
    </tbody></table></div>
  <div class="table-block nh-compact"><div class="table-title" style="color:#f59e0b">🌡️ Bảng 2 — Nhập hàng theo Đông / Mát</div>
    <table>${nhTableHead(day)}<tbody>
    ${nhCatBlock('Lưu Hàng Đông', day.dong, day.dongN, true)}
    ${nhCatBlock('Lưu Hàng Mát', day.mat, day.matN, true)}
    ${nhCatBlock('Hàng Quá Cảnh', day.qc2, day.qc2N, true)}
    </tbody></table></div>`;
  document.getElementById('content').innerHTML = html;
  const urlParams = new URLSearchParams(window.location.search);
  const shot = urlParams.get('screenshot');
  if (shot === 'table1' || shot === 'table2') {
    document.body.classList.add('screenshot-mode-' + shot);
    if (shot === 'table1') {
      const b2 = document.getElementById('blockTable2'); if (b2) b2.style.display = 'none';
    } else {
      const b1 = document.getElementById('blockTable1'); if (b1) b1.style.display = 'none';
    }
  }
}

function getMonth(d) {
  if (d.includes('Mar')) return 3;
  if (d.includes('Apr')) return 4;
  if (d.includes('May')) return 5;
  if (d.includes('Jun')) return 6;
  if (d.includes('Jul')) return 7;
  if (d.startsWith('Tuần') || d.startsWith('Tu\u1EA7n')) return 0; // weekly total
  return 0;
}
function monthLabel(m) { return m===3?'Tháng 3':m===4?'Tháng 4':m===5?'Tháng 5':m===6?'Tháng 6':''; }


function renderRothangCate() {
    const tbody = document.getElementById('tbodyRothangCate');
    const monthSelect = document.getElementById('rothangMonthSelect');
    
    // Extract unique months from CT data
    const months = [...new Set(CT.map(c => c.m))].filter(Boolean).sort();
    
    // Initialize dropdown if empty
    if (monthSelect.options.length === 0) {
        months.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = 'Tháng ' + m;
            monthSelect.appendChild(opt);
        });
        if(months.length > 0) monthSelect.value = months[months.length - 1]; // Default to latest month
    }
    
    const selectedMonth = monthSelect.value;
    if (!selectedMonth) return;

    // Filter data for selected month
    const monthData = CT.filter(c => c.m == selectedMonth);
    
    // Group by cate_hang (which is in c.cate)
    const grouped = {};
    monthData.forEach(c => {
        const cate = c.cate || 'Khác';
        if (!grouped[cate]) grouped[cate] = { totalXuat: 0, rotHang: 0 };
        // The c array structure from CSV parsing:
        // c.sl is So luong xuat. c.rot is So luong rot
        grouped[cate].totalXuat += (Number(c.sl) || 0);
        grouped[cate].rotHang += (Number(c.rot) || 0);
    });
    
    // Sort by rotHang descending
    const sorted = Object.keys(grouped).map(cate => ({
        cate,
        totalXuat: grouped[cate].totalXuat,
        rotHang: grouped[cate].rotHang,
        rate: grouped[cate].totalXuat > 0 ? (grouped[cate].rotHang / grouped[cate].totalXuat * 100) : 0
    })).sort((a, b) => b.rotHang - a.rotHang);

    // Render table
    tbody.innerHTML = '';
    let stt = 1;
    let sumXuat = 0;
    let sumRot = 0;

    sorted.forEach(item => {
        sumXuat += item.totalXuat;
        sumRot += item.rotHang;
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="text-align:center;">${stt++}</td>
            <td>${item.cate}</td>
            <td style="text-align:right;">${item.totalXuat.toLocaleString('en-US')}</td>
            <td style="text-align:right; color:#ef4444;">${item.rotHang.toLocaleString('en-US')}</td>
            <td style="text-align:right;">${item.rate.toFixed(2)}%</td>
        `;
        tbody.appendChild(tr);
    });
    
    // Add Total Row
    const totalRate = sumXuat > 0 ? (sumRot / sumXuat * 100) : 0;
    const trTotal = document.createElement('tr');
    trTotal.style.fontWeight = 'bold';
    trTotal.style.backgroundColor = '#334155';
    trTotal.innerHTML = `
        <td colspan="2" style="text-align:center;">TỔNG CỘNG</td>
        <td style="text-align:right;">${sumXuat.toLocaleString('en-US')}</td>
        <td style="text-align:right; color:#ef4444;">${sumRot.toLocaleString('en-US')}</td>
        <td style="text-align:right;">${totalRate.toFixed(2)}%</td>
    `;
    tbody.appendChild(trTotal);
}

function renderDapUng() {
  document.getElementById('btnPrev').style.display = 'none';
  document.getElementById('btnNext').style.display = 'none';
  document.querySelector('.day-info .date').textContent = 'T\u1ef7 l\u1ec7 \u0110\u00e1p \u1ee9ng';
  document.querySelector('.day-info .dow').textContent = 'T\u1ed5ng h\u1ee3p';
  document.querySelector('.day-info .week').textContent = '\u0110\u00e1p \u1ee9ng';

  function duClr(v) { return v >= 99.5 ? '#10b981' : v >= 99 ? '#f59e0b' : '#ef4444'; }
  function diffClr(v) { return Math.abs(v) > 100 ? '#f87171' : '#10b981'; }

  // Initialize filter state
  if (window.daFilterDateFrom === undefined) {
      window.daFilterDateFrom = 'all';
      window.daFilterDateTo = 'all';
      window.daFilterMonth = 0;
      window.daFilterWkFrom = 0;
      window.daFilterWkTo = 0;
      window.daSummary = false;
      window.daMSummary = false;
  }

  // Filter out off days first
  const DAactive = DA.filter(r => !r.off);

  // Compute unique weeks, months, and dates dynamically
  const activeDays = DAactive.filter(r => !r.wkTotal && !r.mTotal);
  const uniqueDates = activeDays.map(r => r.d);
  const uniqueWeeks = [...new Set(activeDays.map(r => parseInt(r.wk.replace('W',''))))].sort((a,b)=>a-b);
  const uniqueMonths = [...new Set(activeDays.map(r => getMonth(r.d)))].sort((a,b)=>a-b);

  // Filter logic
  let filtered = DAactive;

  // Apply Month filter
  if (window.daFilterMonth > 0) {
      filtered = filtered.filter(r => getMonth(r.d) === window.daFilterMonth);
  }

  // Apply Week range filter
  if (window.daFilterWkFrom > 0) {
      filtered = filtered.filter(r => {
          const wn = parseInt(r.wk.replace('W',''));
          return wn >= window.daFilterWkFrom;
      });
  }
  if (window.daFilterWkTo > 0) {
      filtered = filtered.filter(r => {
          const wn = parseInt(r.wk.replace('W',''));
          return wn <= window.daFilterWkTo;
      });
  }

  // Apply Date range filter
  if (window.daFilterDateFrom !== 'all') {
      const fromIdx = uniqueDates.indexOf(window.daFilterDateFrom);
      filtered = filtered.filter(r => {
          if (r.wkTotal || r.mTotal) return true; // Keep totals
          const idx = uniqueDates.indexOf(r.d);
          return idx >= fromIdx;
      });
  }
  if (window.daFilterDateTo !== 'all') {
      const toIdx = uniqueDates.indexOf(window.daFilterDateTo);
      filtered = filtered.filter(r => {
          if (r.wkTotal || r.mTotal) return true; // Keep totals
          const idx = uniqueDates.indexOf(r.d);
          return idx <= toIdx;
      });
  }

  // Apply summary toggle filters
  if (window.daSummary) {

      filtered = filtered.filter(r => r.mTotal || r.wkTotal);

      <div style="display:flex; gap:10px; align-items:center;">
        <span style="color:#94a3b8; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">\ud83d\udcca Xem t\u1ed5ng h\u1ee3p:</span>
        <button style="${btnAct(window.daSummary)}" onclick="window.daSummary=!window.daSummary; window.daMSummary=false; renderDapUng();">\ud83d\udcca T\u1ed5ng tu\u1ea7n</button>
        <button style="${btnAct(window.daMSummary)}" onclick="window.daMSummary=!window.daMSummary; window.daSummary=false; renderDapUng();">\ud83d\udcca T\u1ed5ng th\u00e1ng</button>

          <option value="0" ${window.daFilterMonth===0?'selected':''}>\u2014 T\u1ea5t c\u1ea3 \u2014</option>

      </div>

      <div style="width:1px; height:18px; background:#1e293b;"></div>

      <!-- Week Range Filter -->
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="color:#94a3b8; font-size:11.5px; font-weight:600;">\ud83d\udcca Tu\u1ea7n t\u1eeb:</span>
        <select style="${selStyle}" onchange="window.daFilterWkFrom=+this.value; renderDapUng();">
          <option value="0" ${window.daFilterWkFrom===0?'selected':''}>B\u1ea5t \u0111\u1ea7u</option>
          ${uniqueWeeks.map(w => `<option value="${w}" ${window.daFilterWkFrom===w?'selected':''}>W${w}</option>`).join('')}
        </select>
        <span style="color:#94a3b8; font-size:11px;">\u0111\u1ebfn</span>
        <select style="${selStyle}" onchange="window.daFilterWkTo=+this.value; renderDapUng();">
          <option value="0" ${window.daFilterWkTo===0?'selected':''}>K\u1ebft th\u00fac</option>
          ${uniqueWeeks.map(w => `<option value="${w}" ${window.daFilterWkTo===w?'selected':''}>W${w}</option>`).join('')}
        </select>
      </div>

      <div style="width:1px; height:18px; background:#1e293b;"></div>

      <!-- Date Range Filter -->
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="color:#94a3b8; font-size:11.5px; font-weight:600;">\ud83d\uddd3\ufe0f Ng\u00e0y t\u1eeb:</span>
        <select style="${selStyle}" onchange="window.daFilterDateFrom=this.value; renderDapUng();">
          <option value="all" ${window.daFilterDateFrom==='all'?'selected':''}>\u2014 B\u1ea5t \u0111\u1ea7u \u2014</option>
          ${uniqueDates.map(d => `<option value="${d}" ${window.daFilterDateFrom===d?'selected':''}>${d}</option>`).join('')}
        </select>
        <span style="color:#94a3b8; font-size:11px;">\u0111\u1ebfn</span>
        <select style="${selStyle}" onchange="window.daFilterDateTo=this.value; renderDapUng();">
          <option value="all" ${window.daFilterDateTo==='all'?'selected':''}>\u2014 K\u1ebft th\u00fac \u2014</option>
          ${uniqueDates.map(d => `<option value="${d}" ${window.daFilterDateTo===d?'selected':''}>${d}</option>`).join('')}
        </select>
      </div>
    </div>
  </div>
  `;
  // Table rows
  let rows = '';
  filtered.forEach((r, idx) => {
    const isWk = r.wkTotal;
    const isMt = r.mTotal;
    const isSpecial = isWk || isMt;
    const specColor = isMt ? '245,158,11' : '16,185,129'; // orange for month, green for week
    const specHex = isMt ? '#f59e0b' : '#10b981';
    const bg = isSpecial ? `background:rgba(${specColor},0.08);` : '';
    const bdr = isSpecial ? `border-top:2px solid rgba(${specColor},0.3);border-bottom:2px solid rgba(${specColor},0.3);` : '';
    const fw = isSpecial ? 'font-weight:800;' : '';
    const label = isMt ? `📅 ${r.d}` : isWk ? `📊 ${r.d}` : r.d;
    const dayCol = isSpecial ? `color:${specHex};` : 'color:#94a3b8;';
    const m = getMonth(r.d);
    const mLabel = isSpecial ? '' : ('T' + m);

    let duStr = `${r.du.toFixed(2)}%`;
    let duTlStr = `${r.duTl.toFixed(2)}%`;
    
    if (isSpecial) {
      let prev = null;
      if (isWk) {
         const curWkNum = parseInt(r.wk.replace('W',''));
         prev = DAactive.find(x => x.wkTotal && parseInt(x.wk.replace('W','')) === curWkNum - 1);
      } else if (isMt) {
         for(let i = idx-1; i>=0; i--) { if(filtered[i].mTotal) { prev = filtered[i]; break; } }
      }
      if (prev) {
         let diffDu = (r.du - prev.du).toFixed(2);
         let diffDuTl = (r.duTl - prev.duTl).toFixed(2);
         let arrDu = diffDu > 0 ? '▼' : diffDu < 0 ? '▼' : '';
         let colDu = diffDu > 0 ? '#10b981' : diffDu < 0 ? '#ef4444' : '#64748b';
         let signDu = diffDu > 0 ? '+' : '';
         if (arrDu) duStr += `<br><span style="font-size:9.5px;color:${colDu};font-weight:700">${arrDu} ${signDu}${diffDu}%</span>`;
         
         let arrDuTl = diffDuTl > 0 ? '▼' : diffDuTl < 0 ? '▼' : '';
         let colDuTl = diffDuTl > 0 ? '#10b981' : diffDuTl < 0 ? '#ef4444' : '#64748b';
         let signDuTl = diffDuTl > 0 ? '+' : '';
         if (arrDuTl) duTlStr += `<br><span style="font-size:9.5px;color:${colDuTl};font-weight:700">${arrDuTl} ${signDuTl}${diffDuTl}%</span>`;
      }
    }

    rows += `<tr style="${bg}${bdr}">
      <td style="${fw}color:var(--txt);white-space:nowrap">${label}</td>
      <td style="${dayCol}${fw}text-align:center;font-size:10px">${isWk ? r.wkRange||'' : isMt ? 'Tổng' : r.w||''}</td>
      <td style="text-align:center;color:#10b981;font-size:10px;${fw}">${isSpecial ? '' : r.wk||''}</td>
      <td style="text-align:center;color:#f59e0b;font-size:10px;${fw}">${mLabel}</td>
      <td style="text-align:right;color:#818cf8;${fw}">${fmt(r.fc)}</td>
      <td style="text-align:right;color:#22d3ee;${fw}">${fmt(r.bkTon)}</td>
      <td style="text-align:right;color:#a78bfa;${fw}">${fmt(r.tx)}</td>
      <td style="text-align:right;color:${diffClr(r.diff)};${fw}">${fmt(r.diff)}</td>
      <td style="text-align:right;font-weight:800;color:${duClr(r.du)}">${duStr}</td>
      <td style="text-align:right;color:#818cf8;${fw}">${fmt(r.tlFc)}</td>
      <td style="text-align:right;color:#22d3ee;${fw}">${fmt(r.tlBkTon)}</td>
      <td style="text-align:right;color:#a78bfa;${fw}">${fmt(r.tlTx)}</td>
      <td style="text-align:right;color:${diffClr(r.tlDiff)};${fw}">${fmt(r.tlDiff)}</td>
      <td style="text-align:right;font-weight:800;color:${duClr(r.duTl)}">${duTlStr}</td>
    </tr>`;
  });
  
  let title = 'T\u1ed5ng h\u1ee3p';
  if (window.daSummary) title = 'So s\u00e1nh theo tu\u1ea7n';
  else if (window.daMSummary) title = 'So s\u00e1nh theo th\u00e1ng';
  else if (window.daFilterMonth > 0) title = `Th\u00e1ng ${window.daFilterMonth}`;
  else if (window.daFilterWkFrom > 0 && window.daFilterWkTo > 0) {
      if (window.daFilterWkFrom === window.daFilterWkTo) title = `Tu\u1ea7n ${window.daFilterWkFrom}`;
      else title = `Tu\u1ea7n ${window.daFilterWkFrom} \u0111\u1ebfn ${window.daFilterWkTo}`;
  }

  let html = `${filterHtml}
  <div class="table-block" style="max-width:1200px;overflow-x:auto">
    <div class="table-title" style="color:#10b981">📊 Tỷ lệ Đáp ứng — ${title}</div>
    <table style="table-layout:auto;font-size:11.5px">
    <thead>
      <tr>
        <th rowspan="2" style="width:70px;position:sticky;left:0;background:#141938;z-index:2">Ngày</th>
        <th rowspan="2" style="width:45px">Thứ</th>
        <th rowspan="2" style="width:40px;color:#10b981">Tuần</th>
        <th rowspan="2" style="width:30px;color:#f59e0b">Tháng</th>
        <th colspan="5" style="text-align:center;color:#22d3ee;border-bottom:2px solid #22d3ee">📦 ITEM</th>
        <th colspan="5" style="text-align:center;color:#a78bfa;border-bottom:2px solid #a78bfa">⚖️ Trọng lượng (kg)</th>
      </tr>
      <tr>
        <th style="color:#818cf8">FC</th>
        <th style="color:#22d3ee">Bk Tồn</th>
        <th style="color:#a78bfa">Thực xuất</th>
        <th>CL</th>
        <th style="color:#10b981">% ĐU</th>
        <th style="color:#818cf8">FC</th>
        <th style="color:#22d3ee">Bk Tồn</th>
        <th style="color:#a78bfa">Thực xuất</th>
        <th>CL</th>
        <th style="color:#10b981">% ĐU</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
    </table>
  </div>`;

  document.getElementById('content').innerHTML = html;
  const urlParams = new URLSearchParams(window.location.search);
  const shot = urlParams.get('screenshot');
  if (shot === 'table1' || shot === 'table2') {
    document.body.classList.add('screenshot-mode-' + shot);
    if (shot === 'table1') {
      const b2 = document.getElementById('blockTable2'); if (b2) b2.style.display = 'none';
    } else {
      const b1 = document.getElementById('blockTable1'); if (b1) b1.style.display = 'none';
    }
  }
}

function renderForecast() {
  document.getElementById('btnPrev').style.display = 'none';
  document.getElementById('btnNext').style.display = 'none';
  document.querySelector('.day-info .date').textContent = 'Capacity Forecast';
  const latestMonth = D.length > 0 ? getMonth(D[D.length - 1].d) : 7;
  const mStr = latestMonth === 6 ? 'T6/2026' : latestMonth === 7 ? 'T7/2026' : 'T5/2026';
  document.querySelector('.day-info .dow').textContent = mStr;
  document.querySelector('.day-info .week').textContent = 'Tổng hợp';

  // State for toggles
  if (!window.forecastMetric) {
    window.forecastMetric = 'item';
  }
  const metric = window.forecastMetric;

  // State for filters
  if (window.fcFilterDateFrom === undefined) {
    window.fcFilterDateFrom = 'all';
    window.fcFilterDateTo = 'all';
    window.fcFilterMonth = 0;
    window.fcFilterWkFrom = 0;
    window.fcFilterWkTo = 0;
  }

  // Filter out off days and week/month summary rows
  const activeDA = DA.filter(r => !r.off && !r.wkTotal && !r.mTotal);

  // Generate filter option arrays
  const uniqueDates = activeDA.map(r => r.d);
  const uniqueWeeks = [...new Set(activeDA.map(r => parseInt(r.wk.replace('W',''))))].sort((a,b)=>a-b);
  const uniqueMonths = [...new Set(activeDA.map(r => getMonth(r.d)))].sort((a,b)=>a-b);

  // Apply filters
  let filteredDA = activeDA;

  if (window.fcFilterMonth > 0) {
    filteredDA = filteredDA.filter(r => getMonth(r.d) === window.fcFilterMonth);
  }

  if (window.fcFilterWkFrom > 0) {
    filteredDA = filteredDA.filter(r => {
      const wn = parseInt(r.wk.replace('W',''));
      return wn >= window.fcFilterWkFrom;
    });
  }
  if (window.fcFilterWkTo > 0) {
    filteredDA = filteredDA.filter(r => {
      const wn = parseInt(r.wk.replace('W',''));
      return wn <= window.fcFilterWkTo;
    });
  }

  if (window.fcFilterDateFrom !== 'all') {
    const fromIdx = uniqueDates.indexOf(window.fcFilterDateFrom);
    filteredDA = filteredDA.filter(r => {
      const idx = uniqueDates.indexOf(r.d);
      return idx >= fromIdx;
    });
  }
  if (window.fcFilterDateTo !== 'all') {
    const toIdx = uniqueDates.indexOf(window.fcFilterDateTo);
    filteredDA = filteredDA.filter(r => {
      const idx = uniqueDates.indexOf(r.d);
      return idx <= toIdx;
    });
  }

  let totalFc = 0;
  let totalTx = 0;
  let maxTx = -1;
  let maxTxDate = '';
  let minTx = Infinity;
  let minTxDate = '';
  let exceededDaysCount = 0;

  filteredDA.forEach(r => {
    const fcVal = metric === 'item' ? (r.fc || 0) : (r.tlFc || 0);
    const txVal = metric === 'item' ? (r.tx || 0) : (r.tlTx || 0);
    
    totalFc += fcVal;
    totalTx += txVal;

    if (txVal > maxTx) {
      maxTx = txVal;
      maxTxDate = r.d;
    }
    if (txVal < minTx) {
      minTx = txVal;
      minTxDate = r.d;
    }

    let diffPct = 0;
    if (fcVal === 0) {
      diffPct = txVal > 0 ? 100 : 0;
    } else {
      diffPct = (Math.abs(txVal - fcVal) / fcVal) * 100;
    }
    
    if (diffPct >= 10) {
      exceededDaysCount++;
    }
  });

  const count = filteredDA.length;
  const avgFc = count > 0 ? Math.round(totalFc / count) : 0;
  const avgTx = count > 0 ? Math.round(totalTx / count) : 0;
  if (minTx === Infinity) {
    minTx = 0;
    minTxDate = '-';
  }

  // Styles
  const selStyle = 'background:#141938;color:var(--txt);border:1px solid #1e293b;border-radius:6px;padding:5px 8px;font-size:12px;font-family:Inter;cursor:pointer';

  // Metric Toggle and Dropdown Filters HTML
  const filterHtml = `
  <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:20px; padding:15px; background:#0f1328; border:1px solid #1e293b; max-width:1200px; margin-left:auto; margin-right:auto; border-radius:10px;">
    <!-- Row 1: Select Metric and Reset -->
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div style="display:flex; gap:10px; align-items:center;">
        <span style="color:#94a3b8; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;">📊 Chỉ số hiển thị:</span>
        <button onclick="window.forecastMetric='item'; renderForecast();" style="padding:6px 16px; border-radius:6px; border:1.5px solid ${metric==='item'?'#a78bfa':'#1e293b'}; background:${metric==='item'?'rgba(167,139,250,0.15)':'#141938'}; color:${metric==='item'?'#a78bfa':'#94a3b8'}; font-size:12px; font-weight:700; cursor:pointer; font-family:Inter; transition: all 0.2s;">
          📦 Số lượng (ITEM)
        </button>
        <button onclick="window.forecastMetric='weight'; renderForecast();" style="padding:6px 16px; border-radius:6px; border:1.5px solid ${metric==='weight'?'#a78bfa':'#1e293b'}; background:${metric==='weight'?'rgba(167,139,250,0.15)':'#141938'}; color:${metric==='weight'?'#a78bfa':'#94a3b8'}; font-size:12px; font-weight:700; cursor:pointer; font-family:Inter; transition: all 0.2s;">
          ⚖️ Trọng lượng (kg)
        </button>
      </div>
      
      <button onclick="window.fcFilterDateFrom='all'; window.fcFilterDateTo='all'; window.fcFilterMonth=0; window.fcFilterWkFrom=0; window.fcFilterWkTo=0; renderForecast();" style="padding:5px 12px; border-radius:6px; border:1px solid #ef4444; background:rgba(239,68,68,0.1); color:#f87171; font-size:11px; font-weight:700; cursor:pointer; font-family:Inter; transition: all 0.2s;">
        🔄 Reset Bộ Lọc
      </button>
    </div>

    <div style="height:1px; background:#1e293b;"></div>

    <!-- Row 2: Date, Week, Month Filters -->
    <div style="display:flex; gap:15px; flex-wrap:wrap; align-items:center;">
      <!-- Lọc theo Tháng -->
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="color:#94a3b8; font-size:11.5px; font-weight:600;">📅 Tháng:</span>
        <select style="${selStyle}" onchange="window.fcFilterMonth=+this.value; renderForecast();">
          <option value="0" ${window.fcFilterMonth===0?'selected':''}>— Tất cả —</option>
          ${uniqueMonths.map(m => `<option value="${m}" ${window.fcFilterMonth===m?'selected':''}>Tháng ${m}</option>`).join('')}
        </select>
      </div>

      <div style="width:1px; height:18px; background:#1e293b;"></div>

      <!-- Lọc theo Tuần -->
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="color:#94a3b8; font-size:11.5px; font-weight:600;">📊 Tuần từ:</span>
        <select style="${selStyle}" onchange="window.fcFilterWkFrom=+this.value; renderForecast();">
          <option value="0" ${window.fcFilterWkFrom===0?'selected':''}>Bắt đầu</option>
          ${uniqueWeeks.map(w => `<option value="${w}" ${window.fcFilterWkFrom===w?'selected':''}>W${w}</option>`).join('')}
        </select>
        <span style="color:#94a3b8; font-size:11px;">đến</span>
        <select style="${selStyle}" onchange="window.fcFilterWkTo=+this.value; renderForecast();">
          <option value="0" ${window.fcFilterWkTo===0?'selected':''}>Kết thúc</option>
          ${uniqueWeeks.map(w => `<option value="${w}" ${window.fcFilterWkTo===w?'selected':''}>W${w}</option>`).join('')}
        </select>
      </div>

      <div style="width:1px; height:18px; background:#1e293b;"></div>

      <!-- Lọc theo Ngày -->
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="color:#94a3b8; font-size:11.5px; font-weight:600;">🗓️ Ngày từ:</span>
        <select style="${selStyle}" onchange="window.fcFilterDateFrom=this.value; renderForecast();">
          <option value="all" ${window.fcFilterDateFrom==='all'?'selected':''}>— Bắt đầu —</option>
          ${uniqueDates.map(d => `<option value="${d}" ${window.fcFilterDateFrom===d?'selected':''}>${d}</option>`).join('')}
        </select>
        <span style="color:#94a3b8; font-size:11px;">đến</span>
        <select style="${selStyle}" onchange="window.fcFilterDateTo=this.value; renderForecast();">
          <option value="all" ${window.fcFilterDateTo==='all'?'selected':''}>— Kết thúc —</option>
          ${uniqueDates.map(d => `<option value="${d}" ${window.fcFilterDateTo===d?'selected':''}>${d}</option>`).join('')}
        </select>
      </div>
    </div>
  </div>
  `;

  // KPI cards
  const formatKpi = (val) => metric === 'item' ? fmt(val) : fmt(Math.round(val)) + ' kg';
  let html = filterHtml;
  
  if (count === 0) {
    html += `
    <div class="table-block" style="max-width:1200px; padding:40px; text-align:center; font-size:13px; color:var(--txt2); background:var(--bg2); border:1px solid var(--border); border-radius:8px; margin-left:auto; margin-right:auto;">
      — Không có dữ liệu đối soát phù hợp với bộ lọc đã chọn —
    </div>
    `;
    document.getElementById('content').innerHTML = html;
    return;
  }

  html += `
  <!-- KPI cards -->
  <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:15px; margin-bottom:20px; max-width:1200px; margin-left:auto; margin-right:auto;">
    <div style="background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:15px; text-align:center;">
      <div style="color:var(--txt2); font-size:11px; font-weight:700; margin-bottom:5px; text-transform:uppercase;">Trung Bình Ngày (Thực Xuất)</div>
      <div style="color:#22d3ee; font-size:20px; font-weight:800; margin-bottom:5px;">${formatKpi(avgTx)}</div>
      <div style="color:#94a3b8; font-size:12px; font-weight:700;">Dự báo (FC): ${formatKpi(avgFc)}</div>
    </div>
    <div style="background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:15px; text-align:center;">
      <div style="color:var(--txt2); font-size:11px; font-weight:700; margin-bottom:5px; text-transform:uppercase;">Thực Xuất Cao Nhất</div>
      <div style="color:#10b981; font-size:20px; font-weight:800; margin-bottom:5px;">${formatKpi(maxTx)}</div>
      <div style="color:#94a3b8; font-size:12px; font-weight:700;">Ngày: ${maxTxDate}</div>
    </div>
    <div style="background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:15px; text-align:center;">
      <div style="color:var(--txt2); font-size:11px; font-weight:700; margin-bottom:5px; text-transform:uppercase;">Thực Xuất Thấp Nhất</div>
      <div style="color:#f59e0b; font-size:20px; font-weight:800; margin-bottom:5px;">${formatKpi(minTx)}</div>
      <div style="color:#94a3b8; font-size:12px; font-weight:700;">Ngày: ${minTxDate}</div>
    </div>
    <div style="background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:15px; text-align:center;">
      <div style="color:var(--txt2); font-size:11px; font-weight:700; margin-bottom:5px; text-transform:uppercase;">Số Ngày Lệch 10%</div>
      <div style="color:#ef4444; font-size:20px; font-weight:800; margin-bottom:5px;">${exceededDaysCount} ngày</div>
      <div style="color:#94a3b8; font-size:12px; font-weight:700;">So với Dự báo (FC)</div>
    </div>
  </div>

  <!-- Bảng tổng hợp -->
  <div class="table-block" style="max-width:1200px; margin-bottom:20px; overflow-x:auto; margin-left:auto; margin-right:auto;">
    <div class="table-title" style="color:#10b981">📊 Bảng tổng hợp chỉ số đối soát (FC vs Thực xuất)</div>
    <table style="table-layout:auto; font-size:12px; width:100%;">
      <thead>
        <tr>
          <th style="text-align:left; padding: 10px;">Chỉ số</th>
          <th style="text-align:right; padding: 10px; color:#3b82f6;">Dự báo (FC)</th>
          <th style="text-align:right; padding: 10px; color:#a78bfa;">Thực xuất</th>
          <th style="text-align:center; padding: 10px;">Chi tiết / Ngày xảy ra</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="text-align:left; font-weight:700; padding: 8px 10px;">Trung bình ngày</td>
          <td style="text-align:right; color:#3b82f6; padding: 8px 10px;">${formatKpi(avgFc)}</td>
          <td style="text-align:right; color:#a78bfa; padding: 8px 10px;">${formatKpi(avgTx)}</td>
          <td style="text-align:center; color:#94a3b8; padding: 8px 10px;">Tính trên ${count} ngày hoạt động</td>
        </tr>
        <tr class="row-2">
          <td style="text-align:left; font-weight:700; padding: 8px 10px;">Giá trị cao nhất</td>
          <td style="text-align:right; color:#3b82f6; padding: 8px 10px;">-</td>
          <td style="text-align:right; color:#10b981; font-weight:800; padding: 8px 10px;">${formatKpi(maxTx)}</td>
          <td style="text-align:center; color:#10b981; padding: 8px 10px;">Ngày ${maxTxDate}</td>
        </tr>
        <tr>
          <td style="text-align:left; font-weight:700; padding: 8px 10px;">Giá trị thấp nhất</td>
          <td style="text-align:right; color:#3b82f6; padding: 8px 10px;">-</td>
          <td style="text-align:right; color:#f59e0b; font-weight:800; padding: 8px 10px;">${formatKpi(minTx)}</td>
          <td style="text-align:center; color:#f59e0b; padding: 8px 10px;">Ngày ${minTxDate}</td>
        </tr>
        <tr class="row-2">
          <td style="text-align:left; font-weight:700; padding: 8px 10px;">Số ngày chênh lệch &ge; 10%</td>
          <td style="text-align:right; color:#ef4444; font-weight:800; padding: 8px 10px;" colspan="2">${exceededDaysCount} / ${count} ngày</td>
          <td style="text-align:center; color:#ef4444; font-weight:700; padding: 8px 10px;">Tỷ lệ: ${count > 0 ? (exceededDaysCount / count * 100).toFixed(1) : 0}%</td>
        </tr>
      </tbody>
    </table>
  </div>
  `;

  // Draw dynamically responsive chart using SVG
  const chartHeight = 250;
  const chartPaddingLeft = 55;
  const chartPaddingRight = 20;
  const chartPaddingTop = 50;
  const chartPaddingBottom = 30;
  const svgWidth = 1150;
  
  const maxVal = Math.max(...filteredDA.map(r => Math.max(
    metric === 'item' ? (r.fc || 0) : (r.tlFc || 0), 
    metric === 'item' ? (r.tx || 0) : (r.tlTx || 0)
  ))) || 1;
  const scaleY = (chartHeight - chartPaddingTop - chartPaddingBottom) / maxVal;
  
  const colCount = filteredDA.length;
  const graphWidth = svgWidth - chartPaddingLeft - chartPaddingRight;
  const stepX = graphWidth / Math.max(colCount, 1);
  const barWidth = Math.max(stepX * 0.35, 4);

  let gridLines = '';
  for (let i = 0; i <= 4; i++) {
    const yVal = Math.round(maxVal * (i / 4));
    const yPos = chartHeight - chartPaddingBottom - (yVal * scaleY);
    gridLines += `
      <line x1="${chartPaddingLeft}" y1="${yPos}" x2="${svgWidth - chartPaddingRight}" y2="${yPos}" stroke="#1e293b" stroke-dasharray="3,3" />
      <text x="${chartPaddingLeft - 10}" y="${yPos + 4}" fill="#64748b" font-size="9" text-anchor="end">${metric === 'item' ? fmt(yVal) : fmt(Math.round(yVal))}</text>
    `;
  }

  let bars = '';
  filteredDA.forEach((r, idx) => {
    const xCenter = chartPaddingLeft + (idx * stepX) + (stepX / 2);
    
    const fcVal = metric === 'item' ? (r.fc || 0) : (r.tlFc || 0);
    const txVal = metric === 'item' ? (r.tx || 0) : (r.tlTx || 0);

    const fcHeight = fcVal * scaleY;
    const fcY = chartHeight - chartPaddingBottom - fcHeight;
    const fcX = xCenter - barWidth - 1;

    const txHeight = txVal * scaleY;
    const txY = chartHeight - chartPaddingBottom - txHeight;
    const txX = xCenter + 1;

    let diffPct = 0;
    if (fcVal === 0) {
      diffPct = txVal > 0 ? 100 : 0;
    } else {
      diffPct = (Math.abs(txVal - fcVal) / fcVal) * 100;
    }
    const exceeded = diffPct >= 10;
    const actualColor = exceeded ? "#ef4444" : "#a78bfa";
    const labelMetric = metric === 'item' ? '' : ' kg';

    // Dynamic rotation and sizing of text values on top of bars
    let fcTextNode = '';
    let txTextNode = '';
    if (exceeded) {
      if (colCount > 20) {
        txTextNode = `<text x="${txX + barWidth/2}" y="${txY - 4}" fill="${actualColor}" font-size="6.5" font-weight="700" text-anchor="start" transform="rotate(-90, ${txX + barWidth/2}, ${txY - 4})">${Math.round(txVal)}</text>`;
      } else {
        txTextNode = `<text x="${txX + barWidth/2}" y="${txY - 4}" fill="${actualColor}" font-size="8.5" font-weight="700" text-anchor="middle">${Math.round(txVal)}</text>`;
      }
    }

    bars += `
      <g>
        <title>${r.d}: Dự báo (FC): ${fmt(Math.round(fcVal))}${labelMetric} | Thực xuất: ${fmt(Math.round(txVal))}${labelMetric} (Lệch: ${diffPct.toFixed(1)}%)</title>
        <rect x="${fcX}" y="${fcY}" width="${barWidth}" height="${fcHeight}" fill="#3b82f6" rx="2" opacity="0.85" />
        <rect x="${txX}" y="${txY}" width="${barWidth}" height="${txHeight}" fill="${actualColor}" rx="2" opacity="0.85" />
        ${fcTextNode}
        ${txTextNode}
        <text x="${xCenter}" y="${chartHeight - 10}" fill="#94a3b8" font-size="9" text-anchor="middle">${r.d}</text>
      </g>
    `;
  });

  const chartTitle = metric === 'item' ? '📊 Biểu đồ so sánh Dự báo (FC) (ITEM) vs Thực xuất (ITEM)' : '📊 Biểu đồ so sánh Dự báo (FC) (Trọng lượng) vs Thực xuất (Trọng lượng)';

  html += `
  <div class="table-block" style="max-width:1200px; padding:15px; margin-bottom:20px; overflow-x:auto; margin-left:auto; margin-right:auto;">
    <div style="display:flex; justify-content:flex-end; align-items:center; margin-bottom:15px;">
      <div style="display:flex; gap:15px; font-size:11px;">
        <span style="display:flex; align-items:center; gap:5px; color:#3b82f6;"><span style="display:inline-block; width:10px; height:10px; background:#3b82f6; border-radius:2px;"></span> Dự báo (FC)</span>
        <span style="display:flex; align-items:center; gap:5px; color:#a78bfa;"><span style="display:inline-block; width:10px; height:10px; background:#a78bfa; border-radius:2px;"></span> Thực xuất (Bình thường)</span>
        <span style="display:flex; align-items:center; gap:5px; color:#ef4444;"><span style="display:inline-block; width:10px; height:10px; background:#ef4444; border-radius:2px;"></span> Thực xuất (Lệch FC 10%)</span>
      </div>
    </div>
    <div style="min-width:1150px;">
      <svg width="100%" height="${chartHeight}" viewBox="0 0 ${svgWidth} ${chartHeight}" style="overflow:visible;">
        ${gridLines}
        ${bars}
        <line x1="${chartPaddingLeft}" y1="${chartHeight - chartPaddingBottom}" x2="${svgWidth - chartPaddingRight}" y2="${chartHeight - chartPaddingBottom}" stroke="#334155" />
      </svg>
    </div>
  </div>
  `;

  let tableRows = '';
  filteredDA.forEach(r => {
    const fcVal = r.fc || 0;
    const tx = r.tx || 0;
    const diffItem = tx - fcVal;
    
    // Check chênh lệch item
    const itemDiffPct = fcVal > 0 ? (Math.abs(tx - fcVal) / fcVal * 100) : (tx > 0 ? 100 : 0);
    const itemAccColor = itemDiffPct >= 10 ? '#ef4444' : '#10b981';
    
    const accuracyItemVal = fcVal > 0 ? (tx / fcVal * 100) : 0;
    const accuracyItemStr = fcVal > 0 ? accuracyItemVal.toFixed(1) + '%' : '0.0%';

    const tlFcVal = r.tlFc || 0;
    const tlTx = r.tlTx || 0;
    const diffWeight = tlTx - tlFcVal;
    
    // Check chênh lệch weight
    const weightDiffPct = tlFcVal > 0 ? (Math.abs(tlTx - tlFcVal) / tlFcVal * 100) : (tlTx > 0 ? 100 : 0);
    const weightAccColor = weightDiffPct >= 10 ? '#ef4444' : '#10b981';
    
    const accuracyWeightVal = tlFcVal > 0 ? (tlTx / tlFcVal * 100) : 0;
    const accuracyWeightStr = tlFcVal > 0 ? accuracyWeightVal.toFixed(1) + '%' : '0.0%';

    const diffItemSign = diffItem > 0 ? '+' : '';
    const diffWeightSign = diffWeight > 0 ? '+' : '';

    tableRows += `
    <tr>
      <td style="color:var(--txt); font-weight:700; white-space:nowrap; text-align:center;">${r.d}</td>
      <td style="color:var(--txt2); text-align:center; font-size:11px;">${r.w}</td>
      <td style="color:var(--txt2); text-align:center; font-size:11px;">${r.wk}</td>
      
      <td style="text-align:right; color:#3b82f6;">${fmt(fcVal)}</td>
      <td style="text-align:right; color:#a78bfa;">${fmt(tx)}</td>
      <td style="text-align:right; color:${diffItem >= 0 ? '#10b981' : '#f87171'}">${diffItemSign}${fmt(diffItem)}</td>
      <td style="text-align:right; font-weight:700; color:${itemAccColor};">${accuracyItemStr}</td>

      <td style="text-align:right; color:#3b82f6;">${fmt(Math.round(tlFcVal))}</td>
      <td style="text-align:right; color:#a78bfa;">${fmt(Math.round(tlTx))}</td>
      <td style="text-align:right; color:${diffWeight >= 0 ? '#10b981' : '#f87171'}">${diffWeightSign}${fmt(Math.round(diffWeight))}</td>
      <td style="text-align:right; font-weight:700; color:${weightAccColor};">${accuracyWeightStr}</td>
    </tr>
    `;
  });

  html += `
  <div class="table-block" style="max-width:1200px; overflow-x:auto; margin-left:auto; margin-right:auto;">
    <div class="table-title" style="color:#a78bfa">📊 Bảng dữ liệu chi tiết so sánh dự báo (FC) và thực xuất</div>
    <table style="table-layout:auto; font-size:11.5px;">
      <thead>
        <tr>
          <th rowspan="2" style="width:70px; text-align:center;">Ngày</th>
          <th rowspan="2" style="width:40px; text-align:center;">Thứ</th>
          <th rowspan="2" style="width:40px; text-align:center;">Tuần</th>
          <th colspan="4" style="text-align:center; color:#22d3ee; border-bottom:2px solid #22d3ee;">📦 Số lượng (ITEM)</th>
          <th colspan="4" style="text-align:center; color:#a78bfa; border-bottom:2px solid #a78bfa;">⚖️ Trọng lượng (kg)</th>
        </tr>
        <tr>
          <th style="color:#3b82f6; text-align:right;">Dự báo (FC)</th>
          <th style="color:#a78bfa; text-align:right;">Thực xuất</th>
          <th style="text-align:right;">Chênh lệch</th>
          <th style="color:#10b981; text-align:right;">Độ chính xác</th>
          <th style="color:#3b82f6; text-align:right;">Dự báo (FC)</th>
          <th style="color:#a78bfa; text-align:right;">Thực xuất</th>
          <th style="text-align:right;">Chênh lệch</th>
          <th style="color:#10b981; text-align:right;">Độ chính xác</th>
        </tr>
      </thead>
      <tbody>
        ${tableRows}
      </tbody>
    </table>
  </div>
  `;

  document.getElementById('content').innerHTML = html;
}



// Parent theme & tab listener
function toggleTheme() {
  const isLight = document.body.classList.toggle('light-mode');
  localStorage.setItem('kfm-dashboard-theme-override', isLight ? 'light' : 'dark');
  updateThemeIcon(isLight);
  // Sync wrapper if in iframe
  try {
    window.parent.postMessage({ action: 'themeChanged', isLight: isLight }, '*');
  } catch(e) {}
}

function updateThemeIcon(isLight) {
  const btn = document.getElementById('themeToggleBtn');
  if (!btn) return;
  if (isLight) {
    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;
  } else {
    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#fbbf24;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
  }
}

window.addEventListener('message', (event) => {
  if (event.data) {
    if (event.data.action === 'setTheme') {
      document.body.classList.toggle('light-mode', event.data.isLight);
      updateThemeIcon(event.data.isLight);
    } else if (event.data.action === 'switchSubTab') {
      if (typeof switchTab === 'function') {
        switchTab(event.data.tab);
      }
    }
  }
});

if (window.self !== window.top) {
  document.body.classList.add('in-iframe');
}
